  <!DOCTYPE html>
  <html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <title>WhatsApp Invitation Generator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background:#eef3ff;
        margin:0;
        padding:20px;
        display:flex;
        justify-content:center;
      }
      .container {
        background:white;
        width:100%;
        max-width:900px;
        padding:20px;
        border-radius:10px;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
      }

      /* TAB MENU */
      .tabs {
        display:flex;
        gap:10px;
        margin-bottom:20px;
      }
      .tab {
        padding:10px 20px;
        background:#ddd;
        cursor:pointer;
        border-radius:5px;
        font-weight:bold;
      }
      .tab.active {
        background:#4287f5;
        color:white;
      }

      .page {
        display:none;
      }
      .page.active {
        display:block;
      }
      /* ============================
    GLOBAL ELEMENT STYLE
  ============================ */
  input, select {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  button {
    cursor: pointer;
  }

  /* ============================
    TABLE STYLE
  ============================ */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 14px;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
  }

  th {
    background: #f0f0f0;
    font-weight: bold;
  }

  /* ============================
    BUTTON STYLE
  ============================ */
  .preview-btn {
    background: #3ba55d;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: bold;
  }

  .preview-btn:hover {
    background: #2f8c4d;
  }

  .delete-button {
    background: #dc3545;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: bold;
  }

  .delete-button:hover {
    background: #b52a37;
  }

  /* ============================
    PREVIEW ROW STYLE
  ============================ */
  .preview-row td {
    background: #fafafa;
    padding: 15px;
  }

  .preview-link {
    background: #25D366;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
  }

  .preview-link:hover {
    background: #1ea955;
  }

  .close-preview {
    background: #dc3545;
    color: white;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
  }

  .close-preview:hover {
    background: #b52a37;
  }

    </style>
  </head>

  <body>
  <div class="container">

    <h1 style="text-align:center;margin-top:0;">
      WhatsApp Invitation Generator
    </h1>

    <!-- TABS -->
    <div class="tabs">
      <div id="tabBekasi" class="tab active">Bekasi</div>
      <div id="tabJakarta" class="tab">Jakarta</div>
    </div>

    <!-- BEKASI PAGE -->
    <div id="pageBekasi" class="page active">
      <h2>Wedding Bekasi</h2>
      <div id="bekasiContainer"></div>
    </div>

    <!-- JAKARTA PAGE -->
    <div id="pageJakarta" class="page">
      <h2>Wedding Jakarta</h2>
      <div id="jakartaContainer"></div>
    </div>

  </div>

  <!-- SCRIPT PAGE SWITCH -->
  <script>
  document.getElementById("tabBekasi").onclick = () => {
    document.getElementById("pageBekasi").classList.add("active");
    document.getElementById("pageJakarta").classList.remove("active");

    document.getElementById("tabBekasi").classList.add("active");
    document.getElementById("tabJakarta").classList.remove("active");
  };

  document.getElementById("tabJakarta").onclick = () => {
    document.getElementById("pageJakarta").classList.add("active");
    document.getElementById("pageBekasi").classList.remove("active");

    document.getElementById("tabJakarta").classList.add("active");
    document.getElementById("tabBekasi").classList.remove("active");
  };
  </script>

  <script type="module" src="bekasi.js"></script>
  <script type="module" src="jakarta.js"></script>


  </body>
  </html>
